<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b50"><title>مَنَاسِك • ختمة مشتركة</title><link rel="stylesheet" href="/manasik/styles.css"></head><body><main>
<header class="topbar"><a class="brand" href="/manasik/"><img class="logo" src="/manasik/manasik_logo.png" alt=""><img class="wordmark" src="/manasik/manasik_wordmark.png" alt="مَنَاسِك"></a></header>
<section class="card hero"><div style="max-width:760px;margin:auto;text-align:center"><span class="eyebrow">ختمة مشتركة عبر مَنَاسِك</span><h1 id="title" style="font-size:clamp(34px,7vw,58px)">ختمة قرآن مشتركة</h1><p id="status" class="lead">جارٍ قراءة رابط الختمة…</p><div id="stats" class="stats" hidden><div class="stat"><div id="done" class="number">0</div>مقروء</div><div class="stat"><div id="claimed" class="number">0</div>جاري القراءة</div><div class="stat"><div id="available" class="number">30</div>متاح</div></div><div id="bar" class="progress" hidden><span></span></div><p><a id="open" class="button" hidden>فتح في تطبيق مَنَاسِك</a></p><p class="muted">لا تعرض هذه الصفحة أسماء المشاركين أو معرفاتهم.</p></div></section>
<p class="footer"><a href="/manasik/privacy.html">الخصوصية</a> · <a href="/manasik/support.html">الدعم</a></p>
</main><script src="/manasik/config.js" onerror="void 0"></script><script>
const m=location.pathname.match(/^\/manasik\/k\/([A-Za-z2-9]{6,12})\/?$/);const status=document.getElementById('status'),open=document.getElementById('open');
if(!m){status.textContent='رابط الختمة غير صالح.';status.className='error';}
else{const code=m[1].toUpperCase();status.textContent='رمز الختمة: '+code;open.href='manasik://khatma/'+code;open.hidden=false;const cfg=window.MANASIK_CONFIG;if(cfg&&cfg.supabaseUrl&&cfg.publishableKey&&!cfg.supabaseUrl.includes('YOUR_PROJECT')){fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/public_khatma_summary',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.publishableKey},body:JSON.stringify({p_code:code}),signal:AbortSignal.timeout(12000)}).then(r=>r.ok?r.json():Promise.reject()).then(rows=>{const x=Array.isArray(rows)?rows[0]:rows;if(!x){status.textContent='لم نعثر على ختمة بهذا الرمز.';return;}document.getElementById('title').textContent=x.kind==='deceased'?'ختمة عن روح '+(x.gender==='female'?'المرحومة ':'المرحوم ')+(x.deceased_name||''):'ختمة قرآن مشتركة';document.getElementById('done').textContent=x.completed_count||0;document.getElementById('claimed').textContent=x.claimed_count||0;document.getElementById('available').textContent=x.available_count||0;document.getElementById('stats').hidden=false;document.getElementById('bar').hidden=false;document.querySelector('#bar span').style.width=Math.min(100,((Number(x.completed_count)||0)/30)*100)+'%';status.textContent=x.is_closed?'الختمة مغلقة':'شاركنا القراءة وأتم الجزء الذي تختاره من التطبيق.';}).catch(()=>{status.textContent='تعذر تحميل تقدم الختمة الآن. يمكنك فتحها في التطبيق.';});}}
</script></body></html>
